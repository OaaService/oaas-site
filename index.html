<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAAS</title>
<meta name="description" content="OAAS is a small software studio in Lille, France. We make Sentinel, Teamlock and BabyWatch.">
<meta name="theme-color" content="#141413">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #141413; --fg: #e8e4dd; --fg-2: #a39e96; --fg-3: #6f6a63; --line: #26251f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .page { max-width: 620px; margin: 0 auto; padding: 72px 24px 96px; }
  a { color: var(--fg); text-decoration: underline; text-decoration-color: var(--fg-3); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--fg); }

  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 96px; }
  .top .name { font-family: Newsreader, Georgia, serif; font-size: 22px; font-weight: 500; letter-spacing: -.01em; text-decoration: none; }
  .lang a { font-size: 13px; color: var(--fg-3); text-decoration: none; margin-left: 12px; }
  .lang a.active { color: var(--fg); }

  .intro { font-family: Newsreader, Georgia, serif; font-size: 34px; line-height: 1.25; font-weight: 400; letter-spacing: -.01em; margin: 0 0 20px; }
  .intro em { font-style: italic; color: var(--fg-2); }
  .sub { color: var(--fg-2); margin: 0 0 88px; font-size: 17px; }

  h2 { font-family: Newsreader, Georgia, serif; font-size: 20px; font-weight: 500; margin: 0 0 24px; color: var(--fg-2); font-style: italic; }
  .work { list-style: none; padding: 0; margin: 0 0 88px; }
  .work li { padding: 22px 0; border-top: 1px solid var(--line); }
  .work li:last-child { border-bottom: 1px solid var(--line); }
  .work .t { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .work .t a { font-size: 18px; font-weight: 500; text-decoration: none; }
  .work .t a:hover { text-decoration: underline; }
  .work .t span { font-size: 13px; color: var(--fg-3); white-space: nowrap; }
  .work p { margin: 6px 0 0; color: var(--fg-2); }
  .work .more { margin-top: 10px; font-size: 14px; color: var(--fg-3); }
  .work .links { margin-top: 10px; font-size: 14px; }
  .work .links a { color: var(--fg-2); margin-right: 14px; }

  .about p { margin: 0 0 18px; color: var(--fg-2); }
  .about p strong { color: var(--fg); font-weight: 500; }
  .contact { margin: 0 0 96px; }
  .contact a { font-size: 18px; }

  footer { font-size: 12px; color: var(--fg-3); line-height: 1.7; }
  footer a { color: var(--fg-3); }
</style>
<script src="i18n.js" defer></script>
</head>
<body>
<div class="page">

  <div class="top">
    <a class="name" href="#">OAAS</a>
    <span class="lang"><a href="#" data-lang="en">English</a><a href="#" data-lang="fr">Français</a></span>
  </div>

  <p class="intro" data-i18n="intro"></p>
  <p class="sub" data-i18n="sub"></p>

  <h2 data-i18n="work.h"></h2>
  <ul class="work">
    <li>
      <div class="t"><a href="https://sentinel-app.io" target="_blank" rel="noopener">Sentinel</a><span data-i18n="sentinel.meta"></span></div>
      <p data-i18n="sentinel.p"></p>
    </li>
    <li>
      <div class="t"><a href="https://teamlock.io" target="_blank" rel="noopener">Teamlock</a><span data-i18n="tl.meta"></span></div>
      <p data-i18n="tl.p"></p>
      <p data-i18n="tl.p2"></p>
      <p class="more" data-i18n="tl.more"></p>
      <p class="links"><a href="https://teamlock.io" target="_blank" rel="noopener">teamlock.io</a><a href="https://github.com/Teamlock/Teamlock" target="_blank" rel="noopener">GitHub</a><a href="https://github.com/Teamlock/Documentation" target="_blank" rel="noopener" data-i18n="tl.docs">Documentation</a></p>
    </li>
    <li>
      <div class="t"><a href="privacy.html">BabyWatch</a><span data-i18n="bw.meta"></span></div>
      <p data-i18n="bw.p"></p>
    </li>
  </ul>

  <h2 data-i18n="about.h"></h2>
  <div class="about">
    <p data-i18n="about.p1"></p>
    <p data-i18n="about.p2"></p>
  </div>

  <h2 data-i18n="contact.h"></h2>
  <p class="contact"><a href="mailto:contact@oaas.studio">contact@oaas.studio</a></p>

  <footer>
    <span data-i18n="footer.legal"></span><br>
    <a href="privacy.html" data-i18n="footer.privacy"></a> · <a href="https://github.com/OaaService" target="_blank" rel="noopener">GitHub</a>
  </footer>

</div>
</body>
</html>
